<!-- Casey and Cranbourne Veterinary Hospital — Live Chat Widget -->
<!-- Single self-contained file: inline CSS + JS, no build step, no external calls. -->
<div id="ccvh-widget-root">
<style>
  #ccvh-widget-root, #ccvh-widget-root * { box-sizing: border-box; }
  #ccvh-widget-root {
    --ccvh-primary: #7A1E33;
    --ccvh-primary-dark: #5c1626;
    --ccvh-secondary: #2A9085;
    --ccvh-secondary-dark: #1f6b62;
    --ccvh-bg: #ffffff;
    --ccvh-text: #262223;
    --ccvh-muted: #6b6466;
    --ccvh-border: #ece4e6;
    --ccvh-danger: #C1272D;
    --ccvh-open-dot: #2fae6b;
    --ccvh-closed-dot: #a8a1a3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2147483000;
  }
  #ccvh-launcher {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--ccvh-primary);
    box-shadow: 0 6px 20px rgba(122,30,51,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    border: none;
    padding: 6px;
    overflow: hidden;
  }
  #ccvh-launcher img { width: 100%; height: 100%; object-fit: contain; }
  #ccvh-launcher.ccvh-bounce { animation: ccvhBounce 0.7s ease; }
  @keyframes ccvhBounce {
    0% { transform: translateY(0); }
    30% { transform: translateY(-14px); }
    55% { transform: translateY(0); }
    75% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
  }
  #ccvh-teaser {
    position: absolute;
    right: 20px;
    bottom: 92px;
    max-width: 240px;
    background: var(--ccvh-primary-dark);
    color: #fff;
    padding: 12px 30px 12px 14px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.35;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    pointer-events: auto;
    cursor: pointer;
    display: none;
  }
  #ccvh-teaser::after {
    content: "";
    position: absolute;
    right: 26px;
    bottom: -8px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid var(--ccvh-primary-dark);
  }
  #ccvh-teaser-close {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: none;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  #ccvh-card {
    position: absolute;
    right: 20px;
    bottom: 96px;
    width: 340px;
    max-height: min(560px, calc(100vh - 130px));
    background: var(--ccvh-bg);
    border-radius: 18px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.28);
    display: none;
    flex-direction: column;
    overflow: hidden;
    pointer-events: auto;
  }
  #ccvh-card.ccvh-open { display: flex; }
  #ccvh-header {
    background: var(--ccvh-primary);
    color: #fff;
    padding: 14px 14px 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #ccvh-header-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    padding: 4px;
  }
  #ccvh-header-avatar img { width: 100%; height: 100%; object-fit: contain; }
  #ccvh-header-text { flex: 1; min-width: 0; }
  #ccvh-header-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  #ccvh-header-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ccvh-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ccvh-closed-dot); flex-shrink: 0; }
  #ccvh-status-dot.ccvh-open-dot { background: var(--ccvh-open-dot); }
  #ccvh-header-sub { font-size: 11.5px; opacity: 0.9; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ccvh-header-emergency {
    background: var(--ccvh-danger);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 6px 9px;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-block;
    flex-shrink: 0;
  }
  #ccvh-header-close {
    background: rgba(255,255,255,0.18);
    border: none;
    color: #fff;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    padding: 0;
  }
  #ccvh-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fbf8f8;
  }
  #ccvh-menu-view { display: flex; flex-direction: column; gap: 10px; }
  #ccvh-menu-view.ccvh-hidden { display: none; }
  #ccvh-status-badge {
    align-self: flex-start;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: #e9f7ef;
    color: #1c7a45;
  }
  #ccvh-status-badge.ccvh-closed { background: #f1eeee; color: var(--ccvh-muted); }
  #ccvh-menu-greeting { font-size: 14px; color: var(--ccvh-text); line-height: 1.4; }
  .ccvh-menu-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--ccvh-border);
    background: #fff;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ccvh-text);
    cursor: pointer;
    text-decoration: none;
  }
  .ccvh-menu-btn.ccvh-emergency-menu-btn {
    background: var(--ccvh-danger);
    color: #fff;
    border-color: var(--ccvh-danger);
  }
  .ccvh-menu-btn.ccvh-primary-menu-btn {
    background: var(--ccvh-secondary);
    color: #fff;
    border-color: var(--ccvh-secondary);
  }
  #ccvh-quick-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .ccvh-chip {
    border: 1px solid var(--ccvh-border);
    background: #fff;
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12px;
    cursor: pointer;
    color: var(--ccvh-text);
    text-decoration: none;
    display: inline-block;
  }
  #ccvh-chat-view { display: none; flex-direction: column; gap: 10px; }
  #ccvh-chat-view.ccvh-active { display: flex; }
  .ccvh-msg { display: flex; }
  .ccvh-msg.ccvh-bot { justify-content: flex-start; }
  .ccvh-msg.ccvh-user { justify-content: flex-end; }
  .ccvh-bubble {
    max-width: 82%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.42;
    white-space: pre-wrap;
  }
  .ccvh-msg.ccvh-bot .ccvh-bubble { background: #fff; border: 1px solid var(--ccvh-border); color: var(--ccvh-text); border-bottom-left-radius: 4px; }
  .ccvh-msg.ccvh-user .ccvh-bubble { background: var(--ccvh-secondary); color: #fff; border-bottom-right-radius: 4px; }
  .ccvh-msg-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ccvh-msg-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #ccvh-typing { display: none; align-items: center; gap: 4px; padding: 9px 12px; }
  #ccvh-typing.ccvh-show { display: inline-flex; }
  .ccvh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ccvh-muted); animation: ccvhTyping 1s infinite ease-in-out; }
  .ccvh-dot:nth-child(2) { animation-delay: 0.15s; }
  .ccvh-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ccvhTyping { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  #ccvh-footer {
    border-top: 1px solid var(--ccvh-border);
    padding: 10px;
    display: none;
    gap: 8px;
    flex-shrink: 0;
    background: #fff;
  }
  #ccvh-footer.ccvh-active { display: flex; }
  #ccvh-input {
    flex: 1;
    border: 1px solid var(--ccvh-border);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 13.5px;
    outline: none;
    font-family: inherit;
  }
  #ccvh-send {
    background: var(--ccvh-secondary);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 15px;
  }
  #ccvh-back-to-menu {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--ccvh-secondary);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    padding: 0 0 2px 0;
  }
  @media (max-width: 420px) {
    #ccvh-card { right: 10px; left: 10px; width: auto; bottom: 88px; max-height: calc(100vh - 110px); }
    #ccvh-launcher { right: 14px; bottom: 14px; }
    #ccvh-teaser { right: 14px; max-width: calc(100vw - 90px); font-size: 12.5px; padding: 10px 26px 10px 12px; }
    #ccvh-header-sub { max-width: 140px; }
    #ccvh-header-emergency { font-size: 9.5px; padding: 5px 7px; }
  }
</style>

  /* ======================= Live open/closed status ==================== */
  var DAY_KEYS = ["sun","mon","tue","wed","thu","fri","sat"];

  function getClinicNow(){
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: CCVH_CONFIG.clinicTimeZone,
      weekday: "short", hour: "numeric", minute: "numeric", hour12: false
    });
    var parts = fmt.formatToParts(new Date());
    var map = {};
    parts.forEach(function(p){ map[p.type] = p.value; });
    var weekdayShort = (map.weekday || "Mon").toLowerCase().slice(0,3);
    var hour = parseInt(map.hour, 10);
    if (hour === 24) hour = 0;
    var minute = parseInt(map.minute, 10);
    return { day: weekdayShort, hour: hour, minute: minute };
  }

  function computeStatus(){
    var now = getClinicNow();
    var todayHours = CCVH_CONFIG.businessHours[now.day];
    var decimalTime = now.hour + now.minute / 60;
    var isOpen = !!todayHours && decimalTime >= todayHours.open && decimalTime < todayHours.close;
    return {
      open: isOpen,
      emergencyLabel: isOpen ? "Emergency? Call Now" : "Emergency? Call VRH",
      headerLabel: "🚨 Emergency",
      emergencyHref: isOpen ? CCVH_CONFIG.phoneHref : CCVH_CONFIG.afterHoursHref,
      emergencyNumber: isOpen ? CCVH_CONFIG.phone : CCVH_CONFIG.afterHoursPhone
    };
  }

  function renderStatus(){
    var s = computeStatus();
    if (s.open) {
      statusDot.classList.add("ccvh-open-dot");
      headerSub.textContent = "Open now · " + CCVH_CONFIG.hoursText;
      statusBadge.textContent = "🟢 Open now";
      statusBadge.classList.remove("ccvh-closed");
    } else {
      statusDot.classList.remove("ccvh-open-dot");
      headerSub.textContent = "Currently closed · " + CCVH_CONFIG.hoursText;
      statusBadge.textContent = "⚪ Closed right now — see hours below";
      statusBadge.classList.add("ccvh-closed");
    }
    headerEmergency.textContent = s.headerLabel;
    headerEmergency.href = s.emergencyHref;
    menuEmergency.textContent = "🚨 " + s.emergencyLabel;
    menuEmergency.href = s.emergencyHref;
    return s;
  }
  renderStatus();
  setInterval(renderStatus, 60000);

  /* =========================== Launcher bounce ========================= */
  var bounceTimer = null;
  function startBounce(){
    if (bounceTimer) return;
    bounceTimer = setInterval(function(){
      if (card.classList.contains("ccvh-open")) return;
      launcher.classList.remove("ccvh-bounce");
      void launcher.offsetWidth; // restart animation cleanly

    launcher.classList.remove("ccvh-bounce");
  }

    teaser.style.bottom = "92px";
  }

  /* ============================ Open / close ============================ */
  function openCard(){
    card.classList.add("ccvh-open");
    teaserDismissed = true;
    teaser.style.display = "none";
  }
  function closeCard(){
    card.classList.remove("ccvh-open");

  /* ============================ Chat state =============================== */
  var onboardingStage = "idle"; // idle -> name -> petname -> condition -> done

  var petName = null;

  function showChatView(){
    menuView.classList.add("ccvh-hidden");
    chatView.classList.add("ccvh-active");
    footer.classList.add("ccvh-active");
  }
  function showMenuView(){
    chatView.classList.remove("ccvh-active");

  function scrollToBottom(){
    var body = $("ccvh-body");

  function addMessage(text, sender, opts){
    opts = opts || {};
    var row = document.createElement("div");
    row.className = "ccvh-msg " + (sender === "user" ? "ccvh-user" : "ccvh-bot");
    var bubble = document.createElement("div");
    bubble.className = "ccvh-bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    chatView.appendChild(row);

    if (opts.links && opts.links.length) {
      var linksWrap = document.createElement("div");
      linksWrap.className = "ccvh-msg-links";
      opts.links.forEach(function(l){
        var a = document.createElement("a");
        a.className = "ccvh-chip";
        a.href = l.href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = l.label;
        linksWrap.appendChild(a);
      });
      row.appendChild(linksWrap);
    }
    if (opts.suggestions && opts.suggestions.length) {
      var sugWrap = document.createElement("div");
      sugWrap.className = "ccvh-msg-suggestions";
      opts.suggestions.forEach(function(q){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "ccvh-chip";
        b.textContent = q;
        b.addEventListener("click", function(){ handleUserInput(q); });
        sugWrap.appendChild(b);
      });
      row.appendChild(sugWrap);
    }
    scrollToBottom();
  }

  function showTyping(){
    var row = document.createElement("div");
    row.className = "ccvh-msg ccvh-bot";
    row.id = "ccvh-typing-row";
    var wrap = document.createElement("div");
    wrap.className = "ccvh-bubble";
    wrap.id = "ccvh-typing";
    wrap.classList.add("ccvh-show");
    wrap.innerHTML = '<span class="ccvh-dot"></span><span class="ccvh-dot"></span><span class="ccvh-dot"></span>';
    row.appendChild(wrap);
    chatView.appendChild(row);
    scrollToBottom();
  }
  function removeTyping(){
    var row = $("ccvh-typing-row");
    if (row) row.remove();
  }

  function botReply(text, opts, delay){
    showTyping();
    setTimeout(function(){
      removeTyping();
      addMessage(text, "bot", opts || {});

  /* ============================ Knowledge base ============================ */

      }
    },
    {
      id: "species",
      priority: 3,
      triggers: ["rabbit","guinea pig","ferret","exotic","small pet"],
      handle: function(){
        return { text: "Yes — alongside dogs and cats, we routinely see rabbits, guinea pigs and ferrets, including consultations, procedures, and RHDV vaccination for rabbits." };

  var FALLBACK = "I'm not sure about that one — you can call us on " + CCVH_CONFIG.phone + " or email " + CCVH_CONFIG.email + " and our team will help directly.";

  function normalize(s){
    return (s || "").toLowerCase().replace(/[^a-z0-9\s']/g, " ").replace(/\s+/g, " ").trim();
  }

  function matchMessage(raw){
    var msg = normalize(raw);
    // Emergency always runs first and wins.
    var emergencyIntent = INTENTS[0];
    for (var e = 0; e < emergencyIntent.triggers.length; e++) {
      if (msg.indexOf(normalize(emergencyIntent.triggers[e])) !== -1) {
        return { id: "emergency", result: emergencyIntent.handle() };
      }
    }
    // Then best-match scan across all remaining intents, ordered by priority then trigger specificity.
    var best = null;
    for (var i = 1; i < INTENTS.length; i++) {
      var intent = INTENTS[i];
      for (var j = 0; j < intent.triggers.length; j++) {
        var trig = normalize(intent.triggers[j]);
        if (msg.indexOf(trig) !== -1) {
          if (!best || trig.length > best.trigLen) {
            best = { id: intent.id, trigLen: trig.length, result: intent.handle() };
          }
        }
      }
    }
    if (best) return best;
    return { id: "fallback", result: { text: FALLBACK } };
  }

  /* ============================ Input handling ============================ */
  function handleUserInput(text){
    text = (text || "").trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";

    if (onboardingStage === "name") {
      ownerName = text;
      onboardingStage = "petname";
      botReply("Lovely to meet you, " + ownerName + "! What's your pet's name?");
      return;
    }
    if (onboardingStage === "petname") {
      petName = text;
      onboardingStage = "condition";
      botReply("Great — and what's going on with " + petName + " today? You can describe what's happening, or just ask me about booking, hours, services and more.");
      return;
    }
    if (onboardingStage === "condition") {
      onboardingStage = "done";
      var m = matchMessage(text);
      var prefix = "Thanks, " + ownerName + " — noted for " + petName + ". ";
      showTyping();
      setTimeout(function(){
        removeTyping();
        addMessage(prefix + m.result.text, "bot", { links: m.result.links, suggestions: m.result.suggestions });
      }, 550);
      return;
    }

    // Normal free-form matching (post-onboarding, or via quick-intent chip).
    var match = matchMessage(text);
    botReply(match.result.text, { links: match.result.links, suggestions: match.result.suggestions });
  }

  sendBtn.addEventListener("click", function(){ handleUserInput(input.value); });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") { handleUserInput(input.value); }
  });

  /* ============================ Menu actions ============================ */
  startChatBtn.addEventListener("click", function(){
    showChatView();
    if (chatView.dataset.started) return;
    chatView.dataset.started = "1";
    onboardingStage = "name";
    addMessage("Hi! I'm " + CCVH_CONFIG.assistantName + ". Before we dive in, what's your name?", "bot");
  });

  quickChips.forEach(function(chip){
    chip.addEventListener("click", function(){
      var q = chip.getAttribute("data-q");
      showChatView();
      if (!chatView.dataset.started) {
        chatView.dataset.started = "1";
        onboardingStage = "done"; // quick chips bypass intake entirely
      }
      handleUserInput(q);
    });
  });

  /* ============================ Test harness (QA only) ============================ */
  // Hidden behind an explicit opt-in query param so it never affects real visitors.
  function initTestHarness(){
    var params = new URLSearchParams(window.location.search);
    if (params.get("ccvhtest") !== "1") return;

    window.CCVH_TEST = {
      runAll: function(){
        var cases = [
          { name: "species pricing - cat consult", input: "how much for a cat consult", expectIntentId: "pricing", expectContains: ["Pricing isn't published"] },
          { name: "species pricing - dog checkup", input: "dog checkup cost", expectIntentId: "pricing", expectContains: ["Pricing isn't published"] },
          { name: "weekend hours", input: "are you open saturday", expectIntentId: "hours", expectContains: ["Sat 8am"] },
          { name: "named toxin emergency - chocolate", input: "my dog ate chocolate", expectIntentId: "emergency", expectContains: ["urgent"] },
          { name: "multi-symptom emergency combo", input: "vomiting and won't wake up", expectIntentId: "emergency", expectContains: ["urgent"] },
          { name: "non-emergency symptom - fever", input: "my dog has a fever", expectIntentId: "symptom", expectNotContains: ["call us right away","urgent"] },
          { name: "non-emergency symptom - limping", input: "my dog is limping", expectIntentId: "symptom", expectNotContains: ["urgent"] },
          { name: "bare contact phrasing bug class", input: "contact number", expectIntentId: "contact", expectContains: ["5996 2329"] },
          { name: "bare contact phrasing bug class 2", input: "contact", expectIntentId: "contact", expectContains: ["5996 2329"] },
          { name: "emergency false-positive guard - blood tests", input: "do you do blood tests?", expectIntentId: null, expectNotContainsIntent: "emergency" },
          { name: "emergency false-positive guard - running late", input: "sorry, running late arriving", expectIntentId: null, expectNotContainsIntent: "emergency" },
          { name: "booking", input: "how do I book an appointment", expectIntentId: "booking", expectContains: ["book online"] },
          { name: "not-offered service - boarding", input: "do you offer boarding", expectIntentId: "boarding", expectContains: ["isn't currently"] }
        ];
        var pass = 0, fail = 0;
        cases.forEach(function(c){
          var m = matchMessage(c.input);
          var ok = true;
          var reasons = [];
          if (c.expectIntentId && m.id !== c.expectIntentId) { ok = false; reasons.push("expected intent " + c.expectIntentId + " got " + m.id); }
          if (c.expectNotContainsIntent && m.id === c.expectNotContainsIntent) { ok = false; reasons.push("should NOT have matched intent " + c.expectNotContainsIntent); }
          (c.expectContains || []).forEach(function(sub){
            if (m.result.text.toLowerCase().indexOf(sub.toLowerCase()) === -1) { ok = false; reasons.push("missing substring: " + sub); }
          });
          (c.expectNotContains || []).forEach(function(sub){
            if (m.result.text.toLowerCase().indexOf(sub.toLowerCase()) !== -1) { ok = false; reasons.push("should not contain: " + sub); }
          });
          if (ok) { pass++; console.log("PASS:", c.name); }
          else { fail++; console.error("FAIL:", c.name, reasons, "-> got:", m.id, m.result.text); }
        });

        var status = computeStatus();
        var statusOk = typeof status.open === "boolean" && !!status.emergencyLabel && !!status.emergencyNumber;
        if (statusOk) { pass++; console.log("PASS: dynamic status function well-formed"); }
        else { fail++; console.error("FAIL: dynamic status function malformed", status); }

        console.log("CCVH_TEST summary: " + pass + " passed, " + fail + " failed (of " + (cases.length + 1) + ")");
        return { pass: pass, fail: fail, total: cases.length + 1 };
      }
    };
  }
  initTestHarness();

})();
</script>
